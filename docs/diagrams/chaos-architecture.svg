<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chaos-architecture-title chaos-architecture-desc">
        <title id="chaos-architecture-title">Chaos architecture: ciphertext on the paved road</title>
        <desc id="chaos-architecture-desc">Trust-boundary diagram of Chaos: devices encrypt locally, Caddy and the Spring API accept only ciphertext, PostgreSQL and Kafka persist the outbox path, and plaintext or in-process publish stop at the boundary.</desc>
        <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Instrument+Serif:ital@0;1&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#5c5c5a"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#3a76f0"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#1e4a9a"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#f3f3f0"/>

        <!-- Zones: DEVICE / SERVER / STORE -->
        <rect x="40" y="80" width="280" height="520" rx="8"
              fill="rgba(20,20,20,0.02)" stroke="rgba(20,20,20,0.10)" stroke-width="0.8"/>
        <rect x="52" y="84" width="52" height="12" rx="2" fill="#f3f3f0"/>
        <text x="78" y="93" fill="rgba(20,20,20,0.40)" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">DEVICE</text>

        <rect x="344" y="80" width="520" height="520" rx="8"
              fill="rgba(20,20,20,0.02)" stroke="rgba(20,20,20,0.10)" stroke-width="0.8"/>
        <rect x="356" y="84" width="52" height="12" rx="2" fill="#f3f3f0"/>
        <text x="382" y="93" fill="rgba(20,20,20,0.40)" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">SERVER</text>

        <rect x="888" y="80" width="352" height="520" rx="8"
              fill="rgba(20,20,20,0.02)" stroke="rgba(20,20,20,0.10)" stroke-width="0.8"/>
        <rect x="900" y="84" width="44" height="12" rx="2" fill="#f3f3f0"/>
        <text x="922" y="93" fill="rgba(20,20,20,0.40)" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">STORE</text>

        <!-- Callout: operator never holds the key -->
        <text x="1240" y="44" fill="#141414" font-size="16" font-style="italic"
              font-family="'Instrument Serif', serif" text-anchor="end">the operator never holds the key</text>
        <path d="M 1080,52 Q 700,80 320,168" fill="none"
              stroke="rgba(20,20,20,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="320" cy="168" r="2" fill="#141414"/>

        <!-- Arrows first -->

        <!-- Permitted: CIPHERTEXT Alice → Caddy -->
        <line x1="280" y1="248" x2="376" y2="248" stroke="#3a76f0" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="292" y="228" width="72" height="12" rx="2" fill="#f3f3f0"/>
        <text x="328" y="237" fill="#3a76f0" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.06em">CIPHERTEXT</text>

        <!-- HTTPS Caddy → API -->
        <line x1="536" y1="248" x2="584" y2="248" stroke="#1e4a9a" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="540" y="228" width="40" height="12" rx="2" fill="#f3f3f0"/>
        <text x="560" y="237" fill="#1e4a9a" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.06em">HTTPS</text>

        <!-- WRITE API → PostgreSQL -->
        <line x1="784" y1="248" x2="916" y2="248" stroke="#5c5c5a" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="828" y="228" width="44" height="12" rx="2" fill="#f3f3f0"/>
        <text x="850" y="237" fill="#5c5c5a" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.06em">WRITE</text>

        <!-- OUTBOX PostgreSQL → Kafka -->
        <line x1="1060" y1="280" x2="1060" y2="440" stroke="#5c5c5a" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="1072" y="352" width="52" height="12" rx="2" fill="#f3f3f0"/>
        <text x="1098" y="361" fill="#5c5c5a" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.06em">OUTBOX</text>

        <!-- EVENT Kafka → Bob, under the stores -->
        <path d="M 1060,504 V 544 Q 1060,552 1052,552 H 188 Q 180,552 180,544 V 512"
              fill="none" stroke="#5c5c5a" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="588" y="532" width="44" height="12" rx="2" fill="#f3f3f0"/>
        <text x="610" y="541" fill="#5c5c5a" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.06em">EVENT</text>

        <!-- FANOUT API → Redis -->
        <line x1="684" y1="280" x2="684" y2="440" stroke="#5c5c5a" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="624" y="352" width="48" height="12" rx="2" fill="#f3f3f0"/>
        <text x="648" y="361" fill="#5c5c5a" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.06em">FANOUT</text>

        <!-- SYNC Bob → API -->
        <path d="M 240,432 V 400 Q 240,392 248,392 H 726 Q 734,392 734,384 V 280"
              fill="none" stroke="#5c5c5a" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="456" y="372" width="36" height="12" rx="2" fill="#f3f3f0"/>
        <text x="474" y="381" fill="#5c5c5a" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.06em">SYNC</text>

        <!-- Forbidden: PLAINTEXT stops at device boundary -->
        <line x1="280" y1="268" x2="312" y2="268" stroke="#141414" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="320" cy="268" r="8" fill="#f3f3f0" stroke="#141414" stroke-width="1.2"/>
        <line x1="316" y1="264" x2="324" y2="272" stroke="#141414" stroke-width="1.2"/>
        <line x1="324" y1="264" x2="316" y2="272" stroke="#141414" stroke-width="1.2"/>
        <rect x="288" y="292" width="64" height="12" rx="2" fill="#f3f3f0"/>
        <text x="320" y="301" fill="#141414" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.06em">PLAINTEXT</text>

        <!-- Forbidden: in-process publish stops at the gate -->
        <line x1="634" y1="280" x2="634" y2="312" stroke="#141414" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="634" cy="320" r="8" fill="#f3f3f0" stroke="#141414" stroke-width="1.2"/>
        <line x1="630" y1="316" x2="638" y2="324" stroke="#141414" stroke-width="1.2"/>
        <line x1="638" y1="316" x2="630" y2="324" stroke="#141414" stroke-width="1.2"/>
        <rect x="552" y="304" width="72" height="12" rx="2" fill="#f3f3f0"/>
        <text x="588" y="313" fill="#141414" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.06em">IN-PROCESS</text>

        <!-- Privileged gate ring around API (ink, not accent) -->
        <rect x="576" y="208" width="216" height="80" rx="8" fill="none"
              stroke="rgba(20,20,20,0.30)" stroke-width="1" stroke-dasharray="4,4"/>
        <rect x="584" y="200" width="36" height="12" rx="2" fill="#f3f3f0"/>
        <text x="602" y="209" fill="rgba(20,20,20,0.45)" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.12em">GATE</text>

        <!-- Nodes -->

        <!-- Alice — focal -->
        <rect x="80" y="208" width="200" height="80" rx="6" fill="#f3f3f0"/>
        <rect x="80" y="208" width="200" height="80" rx="6"
              fill="rgba(58,118,240,0.12)" stroke="#3a76f0" stroke-width="1"/>
        <rect x="88" y="216" width="40" height="12" rx="2" fill="transparent" stroke="rgba(58,118,240,0.50)" stroke-width="0.8"/>
        <text x="108" y="225" fill="#3a76f0" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.08em">DEV</text>
        <text x="180" y="248" fill="#141414" font-size="12" font-weight="600"
              font-family="'IBM Plex Sans', 'Geist', sans-serif" text-anchor="middle">Alice device</text>
        <text x="180" y="264" fill="#5c5c5a" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle">WebCrypto · X3DH</text>

        <!-- Caddy — edge -->
        <rect x="376" y="216" width="160" height="64" rx="6" fill="#f3f3f0"/>
        <rect x="376" y="216" width="160" height="64" rx="6"
              fill="rgba(20,20,20,0.03)" stroke="rgba(20,20,20,0.30)" stroke-width="1"/>
        <rect x="384" y="224" width="32" height="12" rx="2" fill="transparent" stroke="rgba(20,20,20,0.22)" stroke-width="0.8"/>
        <text x="400" y="233" fill="#8a8a84" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.08em">EDGE</text>
        <text x="456" y="252" fill="#141414" font-size="12" font-weight="600"
              font-family="'IBM Plex Sans', 'Geist', sans-serif" text-anchor="middle">Caddy</text>
        <text x="456" y="268" fill="#5c5c5a" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle">TLS :443</text>

        <!-- Chaos API — backend -->
        <rect x="584" y="216" width="200" height="64" rx="6" fill="#f3f3f0"/>
        <rect x="584" y="216" width="200" height="64" rx="6"
              fill="#ffffff" stroke="#141414" stroke-width="1"/>
        <rect x="592" y="224" width="28" height="12" rx="2" fill="transparent" stroke="rgba(20,20,20,0.40)" stroke-width="0.8"/>
        <text x="606" y="233" fill="#141414" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="684" y="252" fill="#141414" font-size="12" font-weight="600"
              font-family="'IBM Plex Sans', 'Geist', sans-serif" text-anchor="middle">Chaos API</text>
        <text x="684" y="268" fill="#5c5c5a" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle">Spring · STOMP</text>

        <!-- PostgreSQL — store -->
        <rect x="916" y="216" width="288" height="64" rx="6" fill="#f3f3f0"/>
        <rect x="916" y="216" width="288" height="64" rx="6"
              fill="rgba(20,20,20,0.05)" stroke="#5c5c5a" stroke-width="1"/>
        <rect x="924" y="224" width="24" height="12" rx="2" fill="transparent" stroke="rgba(92,92,90,0.50)" stroke-width="0.8"/>
        <text x="936" y="233" fill="#5c5c5a" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="1060" y="252" fill="#141414" font-size="12" font-weight="600"
              font-family="'IBM Plex Sans', 'Geist', sans-serif" text-anchor="middle">PostgreSQL</text>
        <text x="1060" y="268" fill="#5c5c5a" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle">messages · outbox</text>

        <!-- Bob — input -->
        <rect x="80" y="432" width="200" height="80" rx="6" fill="#f3f3f0"/>
        <rect x="80" y="432" width="200" height="80" rx="6"
              fill="rgba(92,92,90,0.10)" stroke="#8a8a84" stroke-width="1"/>
        <rect x="88" y="440" width="40" height="12" rx="2" fill="transparent" stroke="rgba(138,138,132,0.40)" stroke-width="0.8"/>
        <text x="108" y="449" fill="#8a8a84" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.08em">DEV</text>
        <text x="180" y="472" fill="#141414" font-size="12" font-weight="600"
              font-family="'IBM Plex Sans', 'Geist', sans-serif" text-anchor="middle">Bob device</text>
        <text x="180" y="488" fill="#5c5c5a" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle">decrypt · cursor</text>

        <!-- Redis — store -->
        <rect x="604" y="440" width="160" height="64" rx="6" fill="#f3f3f0"/>
        <rect x="604" y="440" width="160" height="64" rx="6"
              fill="rgba(20,20,20,0.05)" stroke="#5c5c5a" stroke-width="1"/>
        <rect x="612" y="448" width="40" height="12" rx="2" fill="transparent" stroke="rgba(92,92,90,0.50)" stroke-width="0.8"/>
        <text x="632" y="457" fill="#5c5c5a" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.08em">CACHE</text>
        <text x="684" y="476" fill="#141414" font-size="12" font-weight="600"
              font-family="'IBM Plex Sans', 'Geist', sans-serif" text-anchor="middle">Redis</text>
        <text x="684" y="492" fill="#5c5c5a" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle">ws fanout</text>

        <!-- Kafka — store / audit log -->
        <rect x="916" y="440" width="288" height="64" rx="6" fill="#f3f3f0"/>
        <rect x="916" y="440" width="288" height="64" rx="6"
              fill="rgba(20,20,20,0.05)" stroke="#5c5c5a" stroke-width="1"/>
        <rect x="924" y="448" width="28" height="12" rx="2" fill="transparent" stroke="rgba(92,92,90,0.50)" stroke-width="0.8"/>
        <text x="938" y="457" fill="#5c5c5a" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.08em">LOG</text>
        <text x="1060" y="476" fill="#141414" font-size="12" font-weight="600"
              font-family="'IBM Plex Sans', 'Geist', sans-serif" text-anchor="middle">Kafka</text>
        <text x="1060" y="492" fill="#5c5c5a" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle">device event log</text>

        <!-- Legend -->
        <line x1="40" y1="620" x2="1240" y2="620" stroke="rgba(20,20,20,0.10)" stroke-width="0.8"/>
        <text x="40" y="640" fill="#5c5c5a" font-size="8" font-family="'Geist Mono', monospace"
              letter-spacing="0.14em">LEGEND</text>

        <rect x="40" y="656" width="14" height="10" rx="2" fill="rgba(58,118,240,0.12)" stroke="#3a76f0" stroke-width="1"/>
        <text x="60" y="664" fill="#5c5c5a" font-size="8" font-family="'IBM Plex Sans', 'Geist', sans-serif">Device / keys</text>

        <rect x="176" y="656" width="14" height="10" rx="2" fill="#ffffff" stroke="#141414" stroke-width="1"/>
        <text x="196" y="664" fill="#5c5c5a" font-size="8" font-family="'IBM Plex Sans', 'Geist', sans-serif">API / gate</text>

        <rect x="292" y="656" width="14" height="10" rx="2" fill="rgba(20,20,20,0.05)" stroke="#5c5c5a" stroke-width="1"/>
        <text x="312" y="664" fill="#5c5c5a" font-size="8" font-family="'IBM Plex Sans', 'Geist', sans-serif">Store</text>

        <rect x="380" y="656" width="14" height="10" rx="2" fill="rgba(20,20,20,0.03)" stroke="rgba(20,20,20,0.30)" stroke-width="1"/>
        <text x="400" y="664" fill="#5c5c5a" font-size="8" font-family="'IBM Plex Sans', 'Geist', sans-serif">Edge</text>

        <line x1="460" y1="660" x2="488" y2="660" stroke="#3a76f0" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <text x="496" y="664" fill="#5c5c5a" font-size="8" font-family="'IBM Plex Sans', 'Geist', sans-serif">Permitted ciphertext</text>

        <circle cx="656" cy="660" r="5" fill="#f3f3f0" stroke="#141414" stroke-width="1.2"/>
        <line x1="653" y1="657" x2="659" y2="663" stroke="#141414" stroke-width="1"/>
        <line x1="659" y1="657" x2="653" y2="663" stroke="#141414" stroke-width="1"/>
        <text x="668" y="664" fill="#5c5c5a" font-size="8" font-family="'IBM Plex Sans', 'Geist', sans-serif">Blocked</text>

        <line x1="748" y1="660" x2="776" y2="660" stroke="#5c5c5a" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="784" y="664" fill="#5c5c5a" font-size="8" font-family="'IBM Plex Sans', 'Geist', sans-serif">Async / reconnect</text>

        <line x1="932" y1="660" x2="960" y2="660" stroke="#1e4a9a" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="968" y="664" fill="#5c5c5a" font-size="8" font-family="'IBM Plex Sans', 'Geist', sans-serif">HTTP</text>
      </svg>
