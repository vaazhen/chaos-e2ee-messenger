<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chaos · sign in</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg0: #f3f3f0; --bg1: #ffffff; --bg2: #ebebe6;
      --text: #141414; --text-muted: rgba(20,20,20,.56);
      --ink: #141414; --ink-fg: #f6f6f3; --accent: #3a76f0; --accent-muted: rgba(58,118,240,.12);
      --bdr: rgba(20,20,20,.08);
      --font: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      --title-tracking: -0.045em; --kicker-tracking: 0.16em;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg0);
      font-family: var(--font);
      color: var(--text);
    }
    .card {
      width: 420px;
      background: var(--bg1);
      border: 1px solid var(--bdr);
      border-radius: 20px;
      padding: 34px 28px 30px;
      box-shadow: 0 8px 24px rgba(20,20,20,.06);
    }
    .mark {
      width: 64px; height: 64px; margin: 0 auto 18px;
      display: flex; align-items: center; justify-content: center;
      background: var(--ink); color: var(--ink-fg);
      border-radius: 22%; font-size: 27px; font-weight: 600; letter-spacing: -.08em;
    }
    .kicker { text-align: center; font-size: 11px; font-weight: 600; letter-spacing: var(--kicker-tracking); text-transform: uppercase; color: var(--text-muted); }
    h1 { font-size: 34px; font-weight: 600; letter-spacing: var(--title-tracking); text-align: center; margin: 4px 0 8px; }
    .sub { font-size: 14px; color: var(--text-muted); text-align: center; line-height: 1.5; margin-bottom: 24px; }
    label { display: block; font-size: 12px; color: var(--text-muted); font-weight: 700; margin: 0 0 8px; }
    .row { display: flex; gap: 10px; margin-bottom: 14px; }
    .prefix, .inp {
      height: 50px; border: none; border-radius: 18px; background: var(--bg2);
      color: var(--text); font: 16px var(--font);
    }
    .prefix { padding: 0 14px; display: flex; align-items: center; gap: 6px; }
    .inp { flex: 1; padding: 0 16px; outline: none; box-shadow: 0 0 0 3px var(--accent-muted); }
    .btn {
      width: 100%; height: 48px; margin-top: 16px; border: none; border-radius: 12px;
      background: var(--ink); color: var(--ink-fg); font: 600 15px var(--font);
    }
    .foot { margin-top: 18px; text-align: center; font-size: 13px; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">C</div>
    <p class="kicker">Self-hosted · E2EE</p>
    <h1>Chaos</h1>
    <p class="sub">Sign in with your phone. Keys stay on this device.</p>
    <label>Phone</label>
    <div class="row">
      <div class="prefix">🇷🇺 +7</div>
      <input class="inp" value="999 123 45 67" readonly>
    </div>
    <button class="btn">Continue</button>
    <p class="foot">One-time code · then a device identity</p>
  </div>
</body>
</html>
